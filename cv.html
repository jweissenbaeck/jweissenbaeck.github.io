<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacob Weissenbäck — CV</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cv.css">
  <script>
    try {
      if (sessionStorage.getItem('jcky:internalNav') === '1') {
        document.documentElement.classList.add('vt-arriving');
        setTimeout(function () { document.documentElement.classList.remove('vt-arriving'); }, 2500);
      }
    } catch (e) {}
  </script>
</head>
<body class="cv-page">

<!-- NAV -->
<nav class="nav" id="mainNav">
  <div class="nav-left">
    <a href="index.html" class="nav-cell" id="navBack"><span class="nav-txt">Start</span></a>
  </div>
  <div class="nav-right">
    <a href="projects.html" class="nav-cell"><span class="nav-txt">My Work</span></a>
    <a href="cv.html" class="nav-cell is-active"><span class="nav-txt">CV</span></a>
  </div>
</nav>

<!-- CV — Charakterbogen als Bento-Board (Inhalt rendert cv.js) -->
<main class="bn" id="bento" aria-label="Curriculum vitae of Jacob Weissenbäck"></main>

<!-- Detail-Ansicht: wächst aus der geklickten Kachel -->
<div class="bnm" id="bnModal" hidden>
  <div class="bnm-backdrop" data-close></div>
  <div class="bnm-panel" role="dialog" aria-modal="true" aria-labelledby="bnmTitle" data-lenis-prevent>
    <div class="bnm-preview bn-card" aria-hidden="true"></div>
    <div class="bnm-content">
      <header class="bnm-head">
        <span class="bn-label" id="bnmLabel"></span>
        <button class="bnm-close" type="button" data-close>Close <kbd>Esc</kbd></button>
      </header>
      <div class="bnm-inner" id="bnmInner"></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script src="cv.js"></script>
</body>
</html>
