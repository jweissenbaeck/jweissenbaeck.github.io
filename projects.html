<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacob Weissenbäck — Projects</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cv.css">
  <link rel="stylesheet" href="projects.css">
</head>
<body class="cv-page projects-page">

<div class="cursor-dot"  id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- NAV -->
<nav class="nav" id="mainNav">
  <div class="nav-left" id="navBack">
    <a href="index.html" class="cv-nav-back">
      <svg width="20" height="14" viewBox="0 0 20 14" fill="none">
        <line x1="20" y1="7" x2="7" y2="7" stroke="currentColor" stroke-width="1.4"/>
        <polygon points="8,0 0,7 8,14" fill="currentColor"/>
      </svg>
      <span>Zurück zum Start</span>
    </a>
  </div>
  <div class="nav-center-logo">
    <span class="nav-logo-box" id="navLogoName">JCKY</span>
    <span class="nav-logo-sub" id="navLogoSub">PORTFOLIO</span>
  </div>
  <div class="nav-right" id="navDownload">
    <a href="cv.html" class="cv-download-btn-nav">
      <span>CV</span>
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
</nav>

<!-- HERO -->
<div class="cv-hero">
  <h1 class="cv-hero-title">
    <span class="cv-title-clip"><span class="cv-title-inner" id="heroLine1">My</span></span>
    <span class="cv-title-clip"><span class="cv-title-inner" id="heroLine2">Projects</span></span>
  </h1>
</div>

<!-- TAB NAV -->
<div class="proj-tabnav-sentinel" id="projTabnavSentinel"></div>
<div class="proj-tabnav-wrap" id="projTabnavWrap">
  <nav class="proj-tabnav" id="projTabnav">
    <button class="proj-tab is-active" data-tab="uiux" type="button">UI / UX Design</button>
    <button class="proj-tab" data-tab="product" type="button">Product Design</button>
    <button class="proj-tab" data-tab="image" type="button">Image Editing</button>
    <button class="proj-tab" data-tab="ads" type="button">Advertisements</button>
    <button class="proj-tab" data-tab="video" type="button">Video Cutting</button>
    <span class="proj-tabnav-baseline"></span>
    <span class="proj-tab-indicator" id="projTabIndicator"></span>
  </nav>
</div>

<!-- BENTO GRID -->
<div class="proj-bento-wrap" id="projBentoWrap">
  <div class="bento-grid" id="bentoGrid" tabindex="0"></div>

  <div class="bento-controls">
    <button class="bento-arrow" id="bentoArrowLeft" type="button" aria-label="Zurück">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="bento-slider-track" id="bentoSliderTrack">
      <div class="bento-slider-thumb" id="bentoSliderThumb"></div>
    </div>

    <button class="bento-arrow" id="bentoArrowRight" type="button" aria-label="Weiter">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</div>

<script src="script.js"></script>
<script src="projects.js"></script>
</body>
</html>
