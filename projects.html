<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacob Weissenbäck — Work</title>
  <link rel="icon" type="image/svg+xml" href="assets/jcky-logo-bold-small.svg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cv.css">
  <link rel="stylesheet" href="projects.css">

  <script>
    /* Flash-Schutz: Inhalt bei interner Navigation verbergen, bis das ASCII-Overlay übernimmt. */
    try {
      if (sessionStorage.getItem('jcky:internalNav') === '1') {
        document.documentElement.classList.add('vt-arriving');
        setTimeout(function () { document.documentElement.classList.remove('vt-arriving'); }, 2500);
      }
    } catch (e) {}
  </script>
</head>
<body class="cv-page projects-page">


<!-- NAV -->
<nav class="nav" id="mainNav">
  <div class="nav-left">
    <a href="index.html" class="nav-cell" id="navBack"><span class="nav-txt">Start</span></a>
  </div>
  <div class="nav-right">
    <a href="projects.html" class="nav-cell is-active"><span class="nav-txt">My Work</span></a>
    <a href="cv.html" class="nav-cell"><span class="nav-txt">Me</span></a>
  </div>
</nav>

<!-- PROJECTS — Titel-Preview + Sticky-Filter + 2-Spalten-Grid -->
<main class="pj" id="pj">

  <!-- große Titel-Preview -->
  <section class="pj-hero" id="pjHero">
    <h1 class="pj-hero-title" aria-label="My Work"><div class="pj-hero-marquee" id="pjHeroMarquee" aria-hidden="true"></div></h1>
  </section>

  <!-- Filter-Leiste: startet unten, rastet oben sticky ein -->
  <div class="pj-filter" id="pjFilter">
    <div class="pj-filter-group">
      <div class="pj-filter-field" id="pjCatField">
        <button class="pj-filter-btn" id="pjCatBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="pjCatCurrent">Filter</span>
          <svg class="pj-filter-caret" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="square"/></svg>
        </button>
        <ul class="pj-filter-menu" id="pjCatMenu" role="listbox" aria-label="Category"></ul>
      </div>
    </div>
  </div>

  <!-- 2-Spalten-Grid -->
  <div class="pj-grid" id="pjGrid"></div>

</main>

<!-- FOOTER (wie auf der Startseite) -->
<footer class="site-footer" id="siteFooter">
  <div class="site-footer-text" id="footerText">
    <span class="ftp-note">Thank you for visiting my Website!</span>
    <div class="ftp-word" id="footerWord" role="img" aria-label="JCKY"><span class="ftp-word-inner">JCKY</span></div>
  </div>
  <div class="site-footer-bar">
    <nav class="sf-links" aria-label="Footer">
      <a href="#" class="sf-link"><span class="sf-txt">LinkedIn</span></a>
      <a href="mailto:j.weissenbaeck@gmx.at" class="sf-link"><span class="sf-txt">Email</span></a>
      <a href="#" class="sf-link"><span class="sf-txt">Behance</span></a>
    </nav>
    <span class="sf-right"><span class="sf-txt">My Portfolio — made with love</span></span>
  </div>
</footer>

<script src="script.js"></script>
<script src="projects.js"></script>
</body>
</html>
