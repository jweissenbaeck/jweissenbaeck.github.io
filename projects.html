  <link rel="stylesheet" href="mobile.css" media="(max-width: 760px), (hover: none) and (pointer: coarse) and (max-height: 500px)">
  <script>
    // the phone layout has its own css/js, so crossing the breakpoint reloads the page
    (function () {
      var mq = matchMedia('(max-width: 760px), (hover: none) and (pointer: coarse) and (max-height: 500px)');
      if (mq.matches) {
        document.documentElement.classList.add('is-phone');
        // the url bar sliding in/out only changes the height, that's not a real resize
        var w0 = innerWidth;
        addEventListener('resize', function (e) { if (innerWidth === w0) e.stopImmediatePropagation(); else w0 = innerWidth; }, true);
      }
      mq.addEventListener('change', function () { location.reload(); });

      // coming from another page: stay hidden until the page transition covers the screen
      try {
        if (sessionStorage.getItem('jcky:internalNav') === '1') {
          document.documentElement.classList.add('vt-arriving');
          setTimeout(function () { document.documentElement.classList.remove('vt-arriving'); }, 2500);
        }
      } catch (e) {}
    })();
  </script>
</head>
