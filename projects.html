<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jacob Weissenbäck — Work</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cv.css">
  <link rel="stylesheet" href="projects.css">

  <script>
    /* Flash-Schutz: Inhalt bei interner Navigation verbergen, bis das ASCII-Overlay übernimmt. */
    try {
      if (sessionStorage.getItem('jcky:internalNav') === '1') {
        document.documentElement.classList.add('vt-arriving');
        setTimeout(function () { document.documentElement.classList.remove('vt-arriving'); }, 2500);
      }
    } catch (e) {}
  </script>
</head>
<body class="cv-page projects-page">


<!-- NAV -->
<nav class="nav" id="mainNav">
  <div class="nav-left">
    <a href="index.html" class="nav-cell" id="navBack"><span class="nav-txt">Start</span></a>
  </div>
  <div class="nav-right">
    <a href="projects.html" class="nav-cell is-active"><span class="nav-txt">My Work</span></a>
    <a href="cv.html" class="nav-cell"><span class="nav-txt">CV</span></a>
  </div>
</nav>

<!-- PROJECTS — Titel-Preview + Sticky-Filter + 2-Spalten-Grid -->
<main class="pj" id="pj">

  <!-- große Titel-Preview -->
  <section class="pj-hero" id="pjHero">
    <h1 class="pj-hero-title" aria-label="My Work"><div class="pj-hero-marquee" id="pjHeroMarquee" aria-hidden="true"></div></h1>
  </section>

  <!-- Filter-Leiste: startet unten, rastet oben sticky ein -->
  <div class="pj-filter" id="pjFilter">
    <div class="pj-filter-group">
      <span class="pj-filter-label">Filter</span>
      <div class="pj-filter-field" id="pjCatField">
        <button class="pj-filter-btn" id="pjCatBtn" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="pjCatCurrent">Category</span>
          <span class="pj-filter-caret">▾</span>
        </button>
        <ul class="pj-filter-menu" id="pjCatMenu" role="listbox" aria-label="Category"></ul>
      </div>
    </div>
  </div>

  <!-- 2-Spalten-Grid -->
  <div class="pj-grid" id="pjGrid"></div>

</main>

<script src="script.js"></script>
<script src="projects.js"></script>
</body>
</html>
